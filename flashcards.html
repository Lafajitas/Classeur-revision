<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one deck at a time — filters, progress, a single flip card, then answer buttons */
:root{
  --bg:#f2f4f2; --paper:#fbfcfb; --fg:#1b2420; --muted:#5f6b66; --line:#d5dbd6; --accent:#1f4d3f;
  --ok:#1f7a4d; --ko:#b4531f;
  --m1:#0f6b5c; --m2:#3c5aa8; --m3:#8a3f86; --m4:#b4531f; --m5:#8a6d12; --m6:#b0303f; --m9:#7a4b2a;--m7:#4f6b12;--m8:#2f6f8f;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --paper:#181f1c; --fg:#e3ebe7; --muted:#97a39e; --line:#2e3834; --accent:#8fd3b8; --ok:#6fcf9b; --ko:#f08a52;
  --m1:#4cc3ad; --m2:#8aa6f2; --m3:#d38bd0; --m4:#f08a52; --m5:#d9b54a; --m6:#f07a87; --m9:#d9a07a;--m7:#b5cf5e;--m8:#6fc0e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --paper:#181f1c; --fg:#e3ebe7; --muted:#97a39e; --line:#2e3834; --accent:#8fd3b8; --ok:#6fcf9b; --ko:#f08a52;
  --m1:#4cc3ad; --m2:#8aa6f2; --m3:#d38bd0; --m4:#f08a52; --m5:#d9b54a; --m6:#f07a87; --m9:#d9a07a;--m7:#b5cf5e;--m8:#6fc0e0; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1.05;margin:4px 0 6px}
.lede{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.btn{font:inherit;font-size:13.5px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--fg)}
.btn{cursor:pointer}
.btn:hover{border-color:var(--fg)}
label.tog{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.prog{display:grid;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar .k{background:var(--ok)} .bar .r{background:var(--ko)}
.prog p{margin:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{position:relative;min-height:280px;perspective:1400px;cursor:pointer}
.face{position:absolute;inset:0;border-radius:14px;border:1px solid var(--line);background:var(--paper);padding:22px 24px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1);border-top:4px solid var(--c)}
.back{transform:rotateY(180deg)}
.card.flip .front{transform:rotateY(-180deg)} .card.flip .back{transform:rotateY(0)}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.meta b{color:var(--c);letter-spacing:.04em;text-transform:uppercase;font-size:11.5px}
.q{font-family:var(--display);font-weight:500;font-size:clamp(20px,3.4vw,26px);line-height:1.25;align-self:center;text-wrap:balance}
.a{font-size:17px;align-self:center;white-space:pre-line}
.hint{font-size:12.5px;color:var(--muted)}
.card:focus-visible,.chip:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer button{font:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:10px;cursor:pointer;border:1.5px solid}
.ko{color:var(--ko);border-color:var(--ko);background:color-mix(in srgb,var(--ko) 8%,var(--paper))}
.okb{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--paper))}
.done{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;display:grid;gap:10px;justify-items:center}
.done h2{font-family:var(--display);font-weight:500;margin:0}
.keys{font-size:12.5px;color:var(--muted);margin:0}
kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}
</style></head><body>
<style>.cl-back{display:flex;align-items:center;gap:8px;padding:10px 16px;font:500 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef1ee;border-bottom:1px solid #d5dbd6}.cl-back a{color:#1f4d3f;text-decoration:none;font-weight:600}.cl-back a:hover{text-decoration:underline}.cl-back span{color:#5f6b66}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cl-back{background:#1a201e;border-color:#2e3834}:root:not([data-theme="light"]) .cl-back a{color:#8fd3b8}:root:not([data-theme="light"]) .cl-back span{color:#97a39e}}:root[data-theme="dark"] .cl-back{background:#1a201e;border-color:#2e3834}:root[data-theme="dark"] .cl-back a{color:#8fd3b8}:root[data-theme="dark"] .cl-back span{color:#97a39e}</style>
<nav class="cl-back" aria-label="Retour"><a href="index.html#flashcards">← Flashcards</a><span>· Classeur de révision</span></nav>

<div class="wrap">
  <header>
    <div class="eyebrow">Classeur de révision</div>
    <h1>Flashcards</h1>
    <p class="lede">Lisez la question, cherchez la réponse de tête, puis retournez la carte. Votre progression reste enregistrée dans ce navigateur.</p>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Matière"></div>
  <div class="row">
    <select id="cours" aria-label="Cours"></select>
    <label class="tog"><input type="checkbox" id="onlyKo"> Seulement les cartes à revoir</label>
    <button class="btn" id="shuffle" type="button">Mélanger</button>
    <button class="btn" id="reset" type="button">Remettre à zéro</button>
  </div>
  <div class="prog"><div class="bar"><span class="k" id="bk"></span><span class="r" id="br"></span></div><p id="ptxt"></p></div>
  <div id="stage"></div>
  <p class="keys"><kbd>Espace</kbd> retourner · <kbd>1</kbd> à revoir · <kbd>2</kbd> je sais · <kbd>←</kbd> <kbd>→</kbd> naviguer</p>
</div>
<script>
const CARDS = [
// Évaluation d'entreprises · cours du 1er oct.
["eval","2026-10-01","Les deux formules de l'ANC ?","Capitaux propres − actif fictif.\nActif réel − passif exigible (dettes + provisions R&C)."],
["eval","2026-10-01","Quels actifs fictifs retire-t-on pour l'ANC ?","Frais d'établissement, charges à répartir (frais d'émission d'emprunts), primes de remboursement des obligations, part non couverte de l'ECA."],
["eval","2026-10-01","Que fait-on de l'écart de conversion passif ?","C'est un gain latent : on l'ajoute aux capitaux propres (il sort du passif exigible)."],
["eval","2026-10-01","Que fait-on des dividendes votés ?","C'est une dette envers les actionnaires : on les retire des capitaux propres (montant par action × nombre d'actions)."],
["eval","2026-10-01","ECA de 250 couvert par une provision de 250 : actif fictif ?","Zéro : la provision, déjà déduite des capitaux propres, neutralise la perte. Seule la part non couverte (ECA − provision) est fictive."],
["eval","2026-10-01","Formule de l'ANCC ?","ANCC = ANC ± plus/moins-values − IDP + IDA.\nValeur mathématique = ANCC / nombre d'actions."],
["eval","2026-10-01","Sur quoi calcule-t-on un IDP ?","Subventions d'investissement, provisions réglementées (hausse des prix, amortissements dérogatoires) et plus-values hors exploitation, × ⅓."],
["eval","2026-10-01","Sur quoi calcule-t-on un IDA ?","Actifs fictifs retirés et moins-values sur actifs, × ⅓ (économie d'impôt)."],
["eval","2026-10-01","Bien d'exploitation ou hors exploitation : quelle valeur ?","Exploitation : valeur d'utilité, sans impôt.\nHors exploitation : valeur vénale, nette d'impôt sur la plus-value."],
["eval","2026-10-01","Quel taux pour actualiser un crédit-bail ?","Le coût de la dette, pas le CMPC."],
["eval","2026-10-01","Une seconde licence en négociation (probabilité 70 %) : quelle valeur ?","Zéro : contrat non signé, on reste prudent quelle que soit la probabilité."],
["eval","2026-10-01","Comment évalue-t-on un droit au bail ?","Valeur actuelle de l'économie de loyer (loyer de marché − loyer payé) sur la durée restante. Payable d'avance : le premier flux n'est pas actualisé."],
["eval","2026-10-01","Goodwill de l'exemple du cours (actifs 2 000, dettes 500, résultat 195, k = 10 %) ?","Rendement 195 / 10 % = 1 950 ; patrimoine 1 545.\nGoodwill = 1 950 − 1 545 = 405."],
["eval","2026-10-01","Titre déjà déprécié : à quoi compare-t-on l'estimation ?","À la VNC, pas à la valeur brute (Hôtel Croisette : 42 000 = 42 000, écart nul)."],
["eval","2026-10-01","Peut-on faire la moyenne des valeurs obtenues ?","Jamais. On présente une fourchette et le prix sort de la négociation."],
["eval", "2026-10-08", "ANCC : valeur d'utilité ou valeur vénale ?", "Biens d'exploitation : valeur d'utilité, pas d'impôt sur la plus-value.\nBiens hors exploitation : valeur vénale nette des frais de cession et de l'impôt sur la plus-value."],
["eval", "2026-10-08", "IDA ou IDP : lequel s'ajoute à l'ANCC ?", "L'IDA (créance fiscale latente) s'ajoute ; l'IDP (dette fiscale latente) se retranche."],
["eval", "2026-10-08", "Comment évaluer une dette financière dans l'ANCC ?", "Actualiser les annuités restantes au taux que l'entreprise obtiendrait aujourd'hui (pas au taux d'origine)."],
["eval", "2026-10-08", "Warrior : emprunt à 8 %, 4 annuités de 149 030, taux du jour 5 %. Impact ?", "CRD 493 606 ; valeur à 5 % : 528 453. La dette augmente de 34 847 → ANCC −34 847."],
["eval", "2026-10-08", "Provision pour litige de 42 000 devenue sans objet ?", "Passif −42 000, IDP 14 000 → capitaux propres +28 000."],
["eval", "2026-10-08", "Comment traiter une caution accordée ?", "Dette probable : risque × annuité, actualisé sur la durée restante. Warrior : 0,1 × 30 000 × [1 − 1,08⁻⁷]/0,08 = 15 619 ajoutés au passif."],
["eval", "2026-10-08", "Stock Warrior de 24 000 abîmé (perte 30 %) ?", "Dépréciation 7 200 → stock 16 800 ; IDA 2 400."],
["eval", "2026-10-08", "Créance Fondu de 46 000, 60 % de chances d'être payée ?", "Provision 40 % = 18 400 → créance 27 600 ; IDA 6 133."],
["eval", "2026-10-08", "Titres de placement : quelle valeur ?", "Cotés : cours moyen du dernier mois. Non cotés : valeur probable de négociation, abattement d'illiquidité de 15 à 25 %."],
["eval", "2026-10-08", "ANCC du cas Warrior ?", "1 140 000 + 1 051 042 − 22 466 + 1 333 + 14 000 + 3 000 − 3 000 = 2 183 909 €, soit ≈ 36,40 € par action."],
["eval", "2026-10-08", "Limites de l'ANCC ?", "Fondé sur les chiffres du passé ; ne tient pas compte des performances (rentabilité) de l'entreprise."],
["eval", "2026-10-08", "Pastouche : comment actualiser le crédit-bail (flux au 1/7) au 31/12/N ?", "Au 30/6/N : 60 000 × [1 − 1,05⁻¹⁰]/0,05 = 463 304, puis × 1,05^0,5 = 474 745. Plus-value 500 000 − 474 745 = 25 255."],
// Évaluation d'entreprises · cours du 12 nov. (goodwill)
["eval", "2026-11-12", "Que mesure le goodwill ?", "La sur-rentabilité de l'entreprise : valeur résiduelle qui s'ajoute (ou se déduit, badwill) aux éléments incorporels évalués directement."],
["eval", "2026-11-12", "Les 3 sources de sur-rentabilité ?", "Capacité distinctive, rente de situation, sous-évaluation de certains actifs."],
["eval", "2026-11-12", "D'où vient un badwill ?", "Une entreprise pas assez performante, qui accumule erreurs et défaillances : B < rA."],
["eval", "2026-11-12", "Formule de la rente de goodwill ?", "Rente = B − r × A\nB : bénéfice associé à A (net d'IS) ; r : rémunération normale ; A : actifs nécessaires à l'exploitation."],
["eval", "2026-11-12", "Quel taux pour actualiser la rente ?", "Toujours le CMP, quelle que soit la base."],
["eval", "2026-11-12", "Formule de la rente actualisée du goodwill ?", "Goodwill = (B − rA) × [1 − (1 + i)⁻ⁿ] / i, avec n ≤ 5 ans (3 ans max pour une société nouvelle)."],
["eval", "2026-11-12", "Méthode des Anglo-saxons ?", "Rente perpétuelle : goodwill = (B − rA) / i."],
["eval", "2026-11-12", "Valeur ajustée par le goodwill ?", "Ve = ANCC* + goodwill, avec ANCC* = ANCC hors éléments incorporels mal évalués (fonds commercial…)."],
["eval", "2026-11-12", "Pourquoi ANCC* et pas ANCC ?", "Pour ne pas compter deux fois la clientèle : le fonds commercial est remplacé par le goodwill."],
["eval", "2026-11-12", "r pour l'ANCC d'exploitation ? pour la VSB ? pour les CPNE ?", "ANCC d'exploitation : coût des capitaux propres.\nVSB et CPNE : CMP."],
["eval", "2026-11-12", "Composition de la VSB ?", "VU des immos d'exploitation (sans actifs fictifs ni fonds commercial) + VU du crédit-bail et biens loués + EENE + actifs circulants (dispo comprises) + charges constatées d'avance."],
["eval", "2026-11-12", "Composition des CPNE ?", "VU des immos d'exploitation + VU du crédit-bail et biens loués + BFRE normatif.\nStatique : CPNE = VSB − dettes non financières."],
["eval", "2026-11-12", "Du RCAI au bénéfice associé à l'ANCC d'exploitation ?", "RCAI ± hors exploitation + amort. comptables − amort. sur VU + amort. d'actifs fictifs, puis × ⅔."],
["eval", "2026-11-12", "Retraitements en plus pour la VSB ?", "+ redevances de crédit-bail − amortissement du bien sur VU + charges financières (dettes financières et d'exploitation : escompte, change), puis × ⅔."],
["eval", "2026-11-12", "Pourquoi réintégrer les charges financières pour la VSB ?", "La VSB est indépendante du financement ; les prêteurs sont rémunérés par le CMP dans rA. Sinon on les compte deux fois."],
["eval", "2026-11-12", "Warrior : rente et valeurs (VSB) ?", "B 379 065 − 8 % × 3 665 742 = 85 806.\nVe 5 ans : 2 073 909 + 342 597 = 2 416 506 ; ∞ : 3 146 480."],
["eval", "2026-11-12", "Duchemole : rente ANCC d'exploitation ?", "B 5 653 − 11 % × 48 273 = 343 → × 3,8897 = 1 333 → Ve 55 206 k€."],
["eval", "2026-11-12", "Duchemole : rente VSB ?", "B 6 086 − 9 % × 79 189 = −1 041 (badwill) → −4 049 → Ve 49 824 k€."],
["eval", "2026-11-12", "Potiron : ANCC d'exploitation ?", "ANCC* 4 577 938 − actifs HE nets 1 556 334 = 3 021 604."],
["eval", "2026-11-12", "Potiron : valeurs sur 5 ans ?", "ANCC d'exploitation : 5 388 946 ; VSB : 5 420 134 (très proches)."],
["eval", "2026-11-12", "Coefficient [1 − (1 + i)⁻⁵] / i à 8 % et 9 % ?", "8 % : 3,9927 ; 9 % : 3,8897."],
// Économétrie J1 · 30 sept.
["eco","2026-09-30","Coupe transversale, série temporelle, panel ?","Coupe : plusieurs entités, une période.\nSérie temporelle : une entité, plusieurs périodes.\nPanel : plusieurs entités, au moins deux périodes."],
["eco","2026-09-30","Formule de la variance d'échantillon ?","S² = Σ(Xᵢ − X̄)² / (n − 1).\nPour la population : σ² avec division par N."],
["eco","2026-09-30","Moyenne, médiane : laquelle résiste aux valeurs extrêmes ?","La médiane (et le mode). La moyenne est tirée par les extrêmes (maisons : moyenne 600 000, médiane 300 000)."],
["eco","2026-09-30","Règle des 3 sigma ?","μ ± 1σ : 68 %\nμ ± 2σ : 95 %\nμ ± 3σ : 99,7 %"],
["eco","2026-09-30","Que mesure le coefficient de corrélation r ?","La force relative de la relation linéaire, entre −1 et 1. r = cov / (Sₓ·Sᵧ). Aucune causalité."],
["eco","2026-09-30","Les 5 étapes d'un test d'hypothèse ?","1. H₀ et H₁ · 2. Choisir α · 3. Valeurs critiques · 4. Calculer t · 5. Rejeter ou non H₀."],
["eco","2026-09-30","Règle de décision avec la p-value ?","On rejette H₀ si p-value ≤ α (⇔ |t| ≥ valeur critique)."],
["eco","2026-09-30","Statistique t pour une moyenne (σ inconnu) ?","t = (Ȳ − μ) / (S / √n), avec df = n − 1."],
["eco","2026-09-30","Formule générale d'un intervalle de confiance ?","Estimation ponctuelle ± valeur critique × erreur-type."],
["eco","2026-09-30","Californie : conclusion du test sur la taille des classes ?","Δ = 7,4 ; t = 4,05 > 1,96 → on rejette H₀ à 5 %. IC 95 % = [3,8 ; 11,0], qui ne contient pas 0."],
// Économétrie J2 · 2 oct.
["eco","2026-10-02","Formules de b₁ et b₀ (MCO) ?","b₁ = SS_XY / SS_X = cov / S²ₓ\nb₀ = Ȳ − b₁X̄"],
["eco","2026-10-02","Interpréter b₁ = 0,10977 (prix en k$, surface en sq ft) ?","Chaque sq ft supplémentaire augmente le prix de 109,77 $ en moyenne."],
["eco","2026-10-02","Définition de r² ?","r² = SSR / SST : part de la variation de Y expliquée par X (maisons : 58 %)."],
["eco","2026-10-02","Test sur la pente : hypothèses, statistique, ddl ?","H₀ : β₁ = 0 ; H₁ : β₁ ≠ 0.\nt = b₁ / S_b₁ ; df = n − 2."],
["eco","2026-10-02","Que signifie LINE ?","Linéarité, Indépendance des erreurs, Normalité des erreurs, Égalité des variances (homoscédasticité)."],
["eco","2026-10-02","Résidus en forme d'entonnoir : quel problème ?","Variance non constante (hétéroscédasticité)."],
["eco","2026-10-02","Peut-on prédire hors du domaine des X observés ?","Non : on interpole, on n'extrapole pas."],
["eco","2026-10-02","β Apple = 1,28 : lecture ?","Quand le S&P 500 gagne 1 %, Apple gagne 1,28 % en moyenne : action offensive (β > 1)."],
["eco","2026-10-02","Erreur-type de la régression ?","S_YX = √(SSE / (n − 2))"],
// Économétrie J3 · 7 oct.
["eco", "2026-10-07", "Comment interpréter une pente bⱼ en régression multiple ?", "Variation moyenne de Y pour +1 unité de Xⱼ, les autres X restant constants (ceteris paribus), dans les unités."],
["eco", "2026-10-07", "Tartes : Ŷ = 306,526 − 24,975 Prix + 74,131 Pub (pub en 100 $). Ventes pour 5,50 $ et 350 $ de pub ?", "Pub = 3,5 (centaines de $).\n306,526 − 24,975 × 5,5 + 74,131 × 3,5 = 428,62 tartes."],
["eco", "2026-10-07", "Pourquoi utiliser le r² ajusté ?", "Le r² ne baisse jamais quand on ajoute un X. Le r² ajusté pénalise les variables inutiles et sert à comparer des modèles."],
["eco", "2026-10-07", "Formule du r² ajusté ?", "r²adj = 1 − (1 − r²) × (n − 1) / (n − k − 1)\nTartes : 1 − 0,478 52 × 14/12 = 0,4417."],
["eco", "2026-10-07", "Test F global : hypothèses, statistique, ddl ?", "H₀ : β₁ = … = βₖ = 0 ; H₁ : au moins un βⱼ ≠ 0.\nF = MSR / MSE = (SSR/k) / (SSE/(n − k − 1)) ; df = (k ; n − k − 1)."],
["eco", "2026-10-07", "Où lire la p-value du test F dans Excel ?", "Colonne « Significance F » du tableau ANOVA."],
["eco", "2026-10-07", "Test t en régression multiple : ddl ?", "df = n − k − 1, avec t = bⱼ / S_bⱼ."],
["eco", "2026-10-07", "Variable qualitative à 4 niveaux : combien de variables muettes ?", "3 (niveaux − 1). La catégorie sans dummy est la référence."],
["eco", "2026-10-07", "Que représente le coefficient d'une variable muette ?", "L'écart moyen d'ordonnée par rapport à la catégorie de référence, les autres X constants : droites parallèles."],
["eco", "2026-10-07", "Effet de X₁ avec une interaction β₃X₁X₂ ?", "β₁ + β₃X₂ : l'effet de X₁ change avec X₂. On teste β₃ par un test t."],
["eco", "2026-10-07", "Advertise : Ŷ = 156,43 + 13,081 Radio + 16,795 Presse (k$). Ventes pour 20 k$ + 20 k$ ?", "156,43 + 13,081 × 20 + 16,795 × 20 = 753,95 k$ (≈ 753 950 $)."],
["eco", "2026-10-07", "SLEEP75 : b(totwrk) = −0,166. Lecture pour 1 h de travail en plus par semaine ?", "60 × 0,166 ≈ 10 minutes de sommeil en moins par semaine, à éducation, âge et sexe constants (t = −9,23)."],
["eco", "2026-10-07", "Underwriting : CD = 30,38 et Web = 22,29 (réf. Traditional). Lecture ?", "À aptitude égale, CD-ROM : +30,4 points et Web : +22,3 points en moyenne par rapport à la formation traditionnelle."],
["eco", "2026-10-07", "Neighbor : Ŷ = 243,74 + 9,219 Rooms + 12,697 West. Maison de 9 pièces côté est ?", "243,74 + 9,219 × 9 = 326,71 k$. Côté ouest : +12,70 k$ à nombre de pièces égal."],
["eco", "2026-10-07", "Earning : male × exper = 108,5 (p = 0,045). Interprétation ?", "Interaction significative à 5 % : +1 an d'expérience rapporte 60,6 $/an aux femmes et 60,6 + 108,5 = 169,1 $/an aux hommes. L'écart se creuse avec l'expérience."],
["eco", "2026-10-09", "Y binaire : que représente E(Y|X) ?", "La probabilité que Y = 1 : E(Y|X) = Pr(Y = 1|X). Ŷ = 0,26 → 26 % de chances que Y = 1."],
["eco", "2026-10-09", "LPM : comment lire un coefficient ?", "En points de pourcentage : +1 unité de X → la probabilité que Y = 1 varie de β × 100 points, les autres X constants."],
["eco", "2026-10-09", "Achat : Ŷ = 0,03 + 0,01 income + 0,2 female (income en centaines d'€). Femme à 3 000 €/mois ?", "income = 30.\n0,03 + 0,01 × 30 + 0,2 × 1 = 0,53 → 53 % de probabilité d'acheter."],
["eco", "2026-10-09", "Les deux défauts du LPM ?", "1. L'effet de X est le même quel que soit le niveau de X.\n2. Les probabilités prédites peuvent être < 0 ou > 1."],
["eco", "2026-10-09", "Formule du probit ?", "Pr(Y = 1|X) = Φ(β₀ + β₁X), Φ = fonction de répartition de la loi normale centrée réduite."],
["eco", "2026-10-09", "Probit : β₀ = −2, β₁ = 3, X = 0,4. Probabilité ?", "z = −2 + 1,2 = −0,8 → Φ(−0,8) = 0,2119 (table normale)."],
["eco", "2026-10-09", "Formule du logit ?", "Pr(Y = 1|X) = 1 / (1 + e^−(β₀ + β₁X)), fonction de répartition logistique."],
["eco", "2026-10-09", "Logit : β₀ = −3, β₁ = 2, X = 0,4. Probabilité ?", "z = −2,2 → 1 / (1 + e^2,2) = 1 / 10,025 = 0,0998."],
["eco", "2026-10-09", "Effet marginal aux moyennes : formules probit et logit ?", "Probit : φ(z̄) × β.\nLogit : F(z̄)[1 − F(z̄)] × β.\nz̄ = b₀ + b₁X̄₁ + … calculé aux moyennes."],
["eco", "2026-10-09", "Pseudo-R² de McFadden ?", "1 − ln L(modèle) / ln L(sans X) = 1 − (−2LL) / (−2LL₀).\nHMDA probit : 1 − 1 594,89 / 1 748,67 = 0,0879."],
["eco", "2026-10-09", "Méthode d'estimation du probit et du logit ?", "Le maximum de vraisemblance (le LPM, lui, se fait par MCO)."],
["eco", "2026-10-09", "Table 8.8 : effet marginal de margin dans les 3 modèles ?", "LPM −0,130 ; probit −0,162 ; logit −0,161.\n+1 point d'écart variable − fixe → ≈ −13 à −16 points de probabilité de choisir le taux variable."],
["eco", "2026-10-09", "Hypothèses qui rendent les MCO BLUE ?", "Linéaire dans les β · pas de multicolinéarité parfaite · var(ε|X) = σ² · E(ε|X) = 0 · pas d'autocorrélation · ε ~ N(0, σ²)."],
["eco", "2026-10-09", "Multicolinéarité : conséquence ?", "MCO toujours BLUE mais grandes variances → coefficients souvent non significatifs, effets propres difficiles à isoler."],
["eco", "2026-10-09", "Formule du VIF ? Valeur pour r = 0,9 ?", "VIF = 1 / (1 − r²).\nr = 0,9 → 1 / 0,19 = 5,26. Variance de b multipliée par 5,26."],
["eco", "2026-10-09", "Comment traiter la multicolinéarité ?", "Ne rien faire si elle est modérée ou ne touche pas la variable d'intérêt (ou si c'est age et age²) ; sinon retirer une des variables colinéaires."],
["eco", "2026-10-09", "Hétéroscédasticité : conséquence ?", "Les MCO ne sont plus BLUE (seulement LUE) : erreurs-types fausses, tests t et F peu fiables."],
["eco", "2026-10-09", "Test de Breusch-Pagan en 3 étapes ?", "1. MCO → résidus² e².\n2. Régresser e² sur les k X.\n3. H₀ : tous les α = 0. F significatif (p ≤ α) → hétéroscédasticité."],
["eco", "2026-10-09", "Test de White (abrégé) ?", "Régresser e² sur Ŷ et Ŷ². H₀ : α₂ = α₃ = 0. F significatif → hétéroscédasticité."],
["eco", "2026-10-09", "Remède à l'hétéroscédasticité ? Qu'est-ce qui change ?", "Erreurs-types robustes de White (XLSTAT : HC1). Changent les erreurs-types, t et p-values ; jamais les coefficients ni le R²."],

["ingf","2026-09-28","Les trois types d'opérations (perspective économique) ?","Horizontale (même industrie), verticale (amont ou aval), conglomérale (industries sans lien)."],

["ingf","2026-09-28","Formule et seuils du HHI ?","HHI = Σ (part de marché en %)².\n< 1 000 peu concentré, 1 000-2 000 moyen, > 2 000 très concentré."],

["ingf","2026-09-28","Fusion de 2 firmes sur 5 à 20 % : HHI ?","Avant 2 000, après 40² + 3 × 20² = 2 800. Delta 800 : l'opération attire les autorités."],

["jurpat","2026-10-03","Qu'est-ce que la fente ?","Partage par moitié entre lignes paternelle et maternelle, pour les ascendants et collatéraux ordinaires (3ᵉ et 4ᵉ ordres)."],
["jurpat","2026-10-03","Où joue la représentation ?","À l'infini pour les descendants et pour les descendants des frères et sœurs. Jamais pour les ascendants ni les collatéraux ordinaires."],

// Ingénierie financière Ch. 2 · 5 oct.
["ingf","2026-10-05","Quel modèle pour quel flux ?","Dividendes → DDM ; flux disponibles → FCFF ou FCFE ; valeur comptable + revenus résiduels → RIM."],
["ingf","2026-10-05","Formule de Gordon et ses conditions ?","V₀ = D₁ / (r − g) = D₀(1 + g) / (r − g). Il faut r > g, et ce n'est légitime qu'en phase de maturité (ROE = r)."],
["ingf","2026-10-05","Formule du modèle H ?","V₀ = D₀(1 + gL)/(r − gL) + D₀·H·(gS − gL)/(r − gL), avec H = moitié de la durée de forte croissance."],
["ingf","2026-10-05","10 ans de croissance décroissante : que vaut H ?","H = 5 (la moitié de la durée)."],
["ingf","2026-10-05","Quand préférer les FCF aux dividendes ?","Pas de dividende, dividendes très différents de la capacité à distribuer, ou FCF cohérents avec la rentabilité."],
["ingf","2026-10-05","Formule du FCFE ?","FCFE = NI − (FCInv − Dep) − WCInv + Net Borrowing, avec Net Borrowing = DR·(FCInv − Dep) + DR·WCInv."],
["ingf","2026-10-05","À quel taux actualiser FCFE et FCFF ?","FCFE (et dividendes) : coût des fonds propres. FCFF : CMPC."],
["ingf","2026-10-05","Formule du revenu résiduel ?","RIₜ = Eₜ − r·Bₜ₋₁ = (ROE − r)·Bₜ₋₁ ; V₀ = B₀ + Σ RIₜ / (1+r)ᵗ."],
["ingf","2026-10-05","Pourquoi un résultat net positif ne prouve pas une création de valeur ?","Le résultat déduit le coût de la dette mais pas celui des fonds propres. Il faut RI > 0."],
["ingf","2026-10-05","Comparables boursiers ou transactions passées : faut-il ajouter une prime ?","Comparables boursiers : oui, prix = valeur × (1 + prime). Transactions passées : non, la prime est déjà dans les prix."],
["ingf","2026-10-05","Pourquoi EV/EBITDA est-il apprécié ?","Il ne dépend ni de la structure financière de la cible ni de ses politiques d'amortissement et de provision."],
["ingf","2026-10-05","Formule de l'EV ?","Capitalisation + actions privilégiées + dette (valeur de marché) − disponibilités."],
["ingf","2026-10-05","Formule du VWAP (CMPV) ?","VWAP = Σ(Pᵢ × Vᵢ) / Σ Vᵢ. On compare le prix offert aux CMPV 1, 3, 6 et 12 mois."],
["ingf","2026-10-05","Taux de croissance soutenable ?","g = b × ROE, avec b le taux de rétention des bénéfices."],
["ingf","2026-10-05","Bêta d'une société non cotée ?","Désendetter le bêta d'un comparable : βU = βE / (1 + D/E), puis réendetter : β′E = βU (1 + D′/E′) avec la structure de la cible."],
["ingf","2026-10-05","Bêta ajusté ?","β ajusté = 2/3 × β brut + 1/3 × 1 (les bêtas tendent vers 1)."],
["ingf","2026-10-05","Formule du CMPC ?","WACC = D/(D+E) · rd(1 − T) + E/(D+E) · re, en valeurs de marché."],
["treso", "2026-10-05", "Formule du FRNG ?", "FRNG = Ressources stables − Emplois stables (bilan fonctionnel, valeurs brutes)."],
["treso", "2026-10-05", "Lien entre FRNG, BFR et trésorerie ?", "TN = FRNG − BFR, avec BFR = BFE + BFHE. Et aussi TN = actif de trésorerie − passif de trésorerie."],
["treso", "2026-10-05", "Deux grandes causes d'une crise de trésorerie ?", "Une hausse du BFR (croissance non maîtrisée, mauvaise gestion, baisse d'activité) ou une baisse du FR (erreur de financement, pertes)."],
["treso", "2026-10-05", "Remède à une erreur de financement (emprunt trop court) ?", "Financement à moyen ou long terme, lease-back, allongement des durées de remboursement."],
["treso", "2026-10-05", "Qu'est-ce que le lease-back ?", "L'entreprise vend un actif et le reprend aussitôt en location longue durée : elle récupère du cash et renforce son FR."],
["treso", "2026-10-05", "Objectif principal du trésorier ?", "Assurer au moindre coût l'équilibre financier à court terme : liquidité, coût bancaire, résultat financier, risques de change et de taux."],
["treso", "2026-10-05", "Qu'est-ce que le budget de trésorerie ?", "Document interne de prévisions mensuelles des encaissements et décaissements, en principe sur un an. Synthèse de tous les budgets."],
["treso", "2026-10-05", "Objectif « trésorerie zéro » ?", "Placer les excédents prévus et financer les déficits au plus bas coût, pour minimiser les frais financiers nets."],
["treso", "2026-10-05", "Les quatre tableaux du budget, dans l'ordre ?", "1. Budget de TVA ; 2. encaissements ; 3. décaissements ; 4. budget de trésorerie."],
["treso", "2026-10-05", "HT ou TTC dans le budget ?", "TTC pour tout ce qui est soumis à TVA. HT pour l'export et les charges non soumises. Les postes du bilan d'ouverture sont déjà TTC."],
["treso", "2026-10-05", "Quand la TVA est-elle payée ?", "Le mois suivant (M+1). En janvier, on paie la TVA à décaisser du bilan N−1."],
["treso", "2026-10-05", "Que faire d'un crédit de TVA ?", "Ce n'est pas un décaissement. Il est remboursé plus tard (M+2 si l'énoncé le dit) : on l'inscrit alors en encaissement."],
["treso", "2026-10-05", "TVA déductible sur un investissement : quel mois ?", "Le mois de l'opération (facture), même si le paiement a lieu plus tard."],
["treso", "2026-10-05", "Qu'est-ce qui n'entre jamais dans le budget de trésorerie ?", "Les charges et produits calculés : dotations, reprises, résultat, variation de stocks."],
["treso", "2026-10-05", "Vente à 30 jours en janvier : quand l'encaisser ?", "En février, en TTC (montant HT × 1,2)."],
["treso", "2026-10-05", "Qu'est-ce que l'affacturage ?", "L'entreprise cède ses factures à un factor qui lui avance les fonds, gère le recouvrement et peut garantir les impayés."],
["treso", "2026-10-05", "Le fonds de garantie de l'affacturage est-il un coût ?", "Non : c'est une retenue (jusqu'à 15 % du CA financé) rendue une fois les créances soldées."],
["treso", "2026-10-05", "Billet de trésorerie : émetteur, minimum, durée ?", "Entreprises solides ; 150 000 € minimum ; 1 jour à 1 an ; intérêts fixes et précomptés."],
["treso", "2026-10-05", "Certificat de dépôt (CDN) ?", "TCN émis par une banque (ou la CDC), 1 jour à 1 an. Placement peu risqué pour une entreprise excédentaire."],
["treso", "2026-10-05", "Escompte : qui supporte le risque d'impayé ?", "L'entreprise : la banque se retourne contre le tireur. L'escompte est une garantie pour la banque, pas un transfert de risque."],
["treso", "2026-10-05", "Cession Dailly ?", "Cession groupée de factures à une banque via un bordereau, contre une avance. L'entreprise reste responsable en cas de défaut."],
["treso", "2026-10-05", "Lettre de change ou billet à ordre ?", "Lettre de change : le créancier ordonne au client de payer. Billet à ordre : le client s'engage à payer."],
["treso", "2026-10-05", "Qu'est-ce que la CPFD ?", "Commission du plus fort découvert : 0,05 % du plus fort découvert de chaque mois. Une par mois concerné."],
["treso", "2026-10-05", "Comment compter les jours d'un escompte ?", "Date de négociation exclue, échéance incluse, puis on ajoute les jours de banque."],
["treso", "2026-10-05", "Taux de l'escompte dans le calcul ?", "Taux d'escompte + commission d'endos, puis on ajoute la commission de manipulation par effet."],

["deriv","2026-09-29","Énoncez la loi du prix unique (lois 1 et 2).","Loi 1 : sur des marchés efficients, un même actif a le même prix.\nLoi 2 : si deux stratégies impliquent à une même date des flux identiques, elles ont à tout instant la même valeur.\nLa loi 2 sert à évaluer les dérivés par réplication."],

["deriv","2026-09-29","Quel est le rôle de la chambre de compensation, et quels risques supprime-t-elle ?","Elle s'intercale entre acheteurs et vendeurs (elle est la contrepartie de chacun).\nOutils : dépôt de garantie, appel de marge quotidien, suspension des cotations.\nElle supprime le risque de contrepartie, pas le risque de prix."],

["port","2026-11-17","Test du ratio de variance : principe et exemple ρ = 0,20 ?","Sans autocorrélation : σ²(r_T) = t·σ²(r_t), donc RV = t·σ²(r_t)/σ²(r_T) = 1 (forme de la slide).\nAvec ρ = 0,20 et t = 2 : σ²(r₂) = 2σ²(1 + ρ) → ratio Lo-MacKinlay 1,20 ; RV de la slide = 1/1,20 ≈ 0,833 < 1."],
["port","2026-11-17","Momentum ou sur-réaction : comment les concilier ?","Jegadeesh-Titman : gagnants − perdants = 20,88 − 9,48 = 11,40 %/an ; le gain dure ~12 mois puis s'inverse (cumul ≈ −4 % à 35 mois).\nDe Bondt-Thaler (3-5 ans) : perdants +6,5 %, gagnants −1,7 % → 8,2 %.\nSous-réaction à court terme, sur-réaction à long terme."],
["port","2026-11-17","Étude d'événement : β = 1,2, α = 0 ; titre +5 % / marché +2 %, puis +1 % / +0,5 %, puis −0,4 % / 0 ?","AR = R − (α + β·Rm).\nAR₀ = 5 − 2,4 = 2,6 % ; AR₁ = 1 − 0,6 = 0,4 % ; AR₂ = −0,4 %.\nCAR(0, 2) = 2,6 % : tout se joue le jour 0 → ajustement immédiat (semi-forte)."],
["port","2026-11-17","Splits (FFJR 1969) et annonces de bénéfices (Bernard 1992) : que montrent-ils ?","Splits : le CAR monte ~30 mois avant puis reste plat après → information déjà intégrée, efficience semi-forte. Le split signale les dividendes futurs (672 hausses vs 268 baisses).\nBénéfices : les cours dérivent dans le sens de la surprise pendant ~60 jours → sous-réaction, anomalie."],
["port","2026-11-17","Siegel (2023) : que reste-t-il des effets taille et value ?","Taille : 11,99 % vs 10,35 % (1926-2021), mais 10,03 % vs 9,80 % hors 1975-1983 → effet concentré sur 9 ans.\nValue : petites value 16,24 % vs petites growth 2,83 % (1926-2021) ; en 2006-2021, grandes growth 14,19 % > value 8,37 %."],
["port","2026-11-17","Effets janvier et jours fériés en chiffres ?","Rozeff-Kinney 1904-1974 : 3,48 % en janvier vs 0,42 % → janvier ≈ 3,48 / 8,10 ≈ 43 % du rendement annuel.\nDow Jones 1885-1997 : veille de jour férié 0,340 % vs 0,024 % par jour en moyenne (≈ 14 fois)."],
["port","2026-11-17","3Com / Palm : pourquoi la loi du prix unique est violée ?","1 action 3Com donne 1,5 Palm. Le 2 mars 2000 : 1,5 × 95,06 = 142,59 $, mais 3Com cote 81,81 $.\nLe reste de 3Com vaut donc 81,81 − 142,59 = −60,78 $ : impossible pour une société à responsabilité limitée."],
["port","2026-11-17","Moyenne arithmétique ou géométrique des rentabilités : lien avec la volatilité ?","g ≈ a − σ²/2.\nActions US réelles 1872-2008 : 7,8 % vs 6,0 % → σ² ≈ 2 × 0,018 = 0,036, σ ≈ 19 % (la volatilité à 1 an du cours).\nPour des rentabilités composées, c'est la géométrique qui compte."],
["port","2026-11-17","Diversification temporelle : pourquoi la règle « 100 − âge » est contestée ?","La volatilité annualisée des actions passe de 19 % (1 an) à 9 % (30 ans), et la probabilité de perte réelle de 31 % à 0 % (20 ans).\nMais le risque cumulé augmente : 9 % × √30 ≈ 49 % contre 19 % à 1 an."],
["port","2026-11-17","Impact des frais de gestion à long terme (Cornell et al., 1926-2017) ?","Valeur finale : 6 599 sans frais ; 2 374 avec 1 %/an ; 998 avec 2 % ; 416 avec 3 %.\n1 % de frais divise la richesse finale par 2,8 (≈ −64 %).\nFrance (AMF 2023) : fonds actions 1,79 % ± 0,92 %."],
["port","2026-11-17","Combien explique l'allocation stratégique ? (et le piège)","Brinson, Hood, Beebower (1986) : ≈ 90 % de la variation des rentabilités ; Ibbotson-Kaplan (2000) : 99 % du niveau, 90 % de la variabilité.\nAglietta et al. : marché 90 %, allocation 4 %, sélection 2 %, interaction 4 %.\nPiège : c'est un R² temporel, pas l'écart entre deux fonds."],
["port","2026-11-17","Active share : formule, exemple, et classification de Cremers-Petajisto ?","AS = ½ Σ |w_p − w_b|. Portefeuille (40, 30, 30) vs indice (50, 30, 20) : ½ (10 + 0 + 10) = 10 %.\nAxes : active share (sélection) × tracking error (paris factoriels).\nAS faible + TE faible = closet indexing : frais de gestion active pour un quasi-indice."],
["port","2026-11-17","Calculer une tracking error : écarts mensuels +0,5 ; −0,3 ; +0,2 ; −0,4 % ?","Moyenne = 0. Variance = (0,25 + 0,09 + 0,04 + 0,16)/(4 − 1) = 0,18.\nTE = √0,18 ≈ 0,42 %/mois ≈ 0,42 × √12 ≈ 1,5 %/an.\nC'est ce que le gérant indiciel minimise."],
["port","2026-11-17","Rémunération d'un hedge fund : 15 % brut, 2 % de frais, 20 % de commission ; et le high water mark ?","Commission = 0,20 × (15 − 2) = 2,6 → net 15 − 2 − 2,6 = 10,4 %.\nHWM : 100 → 90 (−10 %) → 103,5 (+15 %) : commission sur 3,5 seulement = 0,7 (au lieu de 2,7).\nHurdle rate = rentabilité minimale avant toute commission."],
["port","2026-11-17","Diversification internationale : ce que montrent les corrélations ?","Corrélation moyenne entre pays : ≈ 0,1-0,23 (1872-1971), 0,47 (1972-2000), 0,88 (2001-2021).\nRisque plancher : 33 % pour un portefeuille français vs 12 % pour un portefeuille mondial.\nLe gain s'érode quand les marchés se synchronisent."],
["port","2026-11-17","CPPI (1 M€, plancher 900 k€, m = 3, rf 1 %) : structure après +10 % puis après −10 % ?","+10 % : 330 000 + 707 000 = 1 037 000 → actions (1 037 000 − 900 000) × 3 = 411 000, BdT 626 000.\n−10 % : 270 000 + 707 000 = 977 000 → actions 231 000, BdT 746 000.\nAchète à la hausse, vend à la baisse (pro-cyclique)."],
["port","2026-11-17","Risque de gap du CPPI (actions 300 000, BdT 707 000, plancher 900 000, m = 3) ?","m = 3 suppose une perte maximale de 1/3 ≈ 33,3 % par période.\n300 000 (1 + x) + 707 000 = 900 000 → x = 193/300 − 1 = −35,7 %.\nUne chute plus forte avant rééquilibrage brise le plancher."],
["port","2026-11-17","Benefic et Écureuil Europe 2003 si l'indice baisse de 30 % ?","Benefic : 23 % − baisse → 23 − 30 = −7 %.\nÉcureuil : 21 % jusqu'à −20 %, puis −1,25 × (baisse − 20) → −1,25 × 10 = −12,5 %.\nCapital protégé seulement jusqu'à un certain niveau de baisse."],
["port","2026-11-17","Fonds A, B, C finissant tous à 120 : comment les départager ?","Année civile : 9,54 %/an pour les trois (A 11 % puis 8,11 % ; C 5 % puis 14,28 %).\nPériodes glissantes (pas mensuel) : B 12,07 % > A 9,46 % > C 4,73 %.\nGlissant : plus représentatif, empêche l'« optimisation », mais 2 ans d'historique minimum."],
["port","2026-11-17","Ratio de Sharpe à numérateur négatif : quel piège ? (rf = 4 %, P et Q à 2 %, σ 5 % et 20 %)","S_P = (2 − 4)/5 = −0,40 ; S_Q = (2 − 4)/20 = −0,10.\nQ paraît meilleur avec 4 fois plus de risque : quand le numérateur est négatif, Sharpe et Treynor deviennent trompeurs."],
["port","2026-11-17","Roy et Sortino : formules et application aux fonds A/B de Batteau (R_L = 0) ?","Roy = (R_P − R_L)/σ_P ; Sortino = (R_P − R_L)/SV, SV = √E[min(R_P − R_L, 0)²].\nA : SV = √(0,1 × 24²) = 7,59 %, Sortino = 9/7,59 = 1,19. B : aucune perte → Sortino infini.\nNB : la moyenne de B vaut 9,4 % (σ 11,68 %), pas 9 %."],
["port","2026-11-17","Lien entre alpha de Jensen et ratio de Treynor ?","α = β (T − T_m), avec T_m = R_m − R_f.\nEx. (rf 6 %, Rm 12 %) : A β 0,5, T 14 % → 0,5 × (14 − 6) = 4 % ; B β 1,5, T 8,67 % → 1,5 × 2,67 = 4 %.\nMême alpha, mais A est meilleur par unité de risque."],
["port","2026-11-17","Pourquoi Jensen donne un alpha négatif au bon market-timer ? Exemple.","β = 1,5 quand l'excès du marché vaut 10 %, β = 0,5 quand il vaut 2 % → excès du fonds 15 % et 1 %.\nPente = (15 − 1)/(10 − 2) = 1,75 ; α = 1 − 1,75 × 2 = −2,5 %.\nTreynor-Mazuy ajoute γ(R_m − R_f)², avec γ > 0 si bon timing."],
["port","2026-11-17","Calculer un ratio d'information : écarts mensuels +1 ; −0,5 ; +2 ; +0,5 % ?","ER moyen = 0,75 %.\nσ(ER) = √(3,25/3) = 1,04 % (diviseur N − 1).\nRI = 0,75/1,04 ≈ 0,72 par mois (≈ 2,5 annualisé avec √12)."],
["port","2026-11-17","MEDAF théorique ou empirique : conséquence pour l'alpha ?","La droite empirique est plus plate (ordonnée à l'origine > Rf) : les faibles bêtas rapportent plus, les forts bêtas moins que prévu.\nUn fonds peut avoir un alpha selon la droite théorique et pas selon l'empirique : un mauvais indice fabrique de faux alphas (Jensen vs Ippolito)."]

const MATIERES={eval:["Évaluation d'entreprises","--m1"],eco:["Économétrie","--m2"],ingf:["Ingénierie financière","--m3"],bank:["Banque","--m4"],trans:["Transmission d'entreprise","--m5"],port:["Gestion de portefeuille","--m6"],treso:["Gestion de trésorerie","--m7"],deriv:["Produits dérivés","--m8"],jurpat:["Gestion juridique du patrimoine","--m9"]};
const all=CARDS.map(([m,c,q,a])=>({m,c,q,a,id:m+"|"+q}));
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
let st={};try{st=JSON.parse(localStorage.getItem("fc-state")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("fc-state",JSON.stringify(st))}catch(e){}};
const h=(location.hash||"").slice(1);
let mat=MATIERES[h]?h:null, cours="", deck=[], i=0, flipped=false;

function chips(){const el=document.getElementById("chips");el.replaceChildren();
  [[null,"Toutes",null],...Object.entries(MATIERES).map(([k,v])=>[k,v[0],v[1]])].forEach(([k,l,c])=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",String(mat===k));
    b.style.setProperty("--c",c?`var(${c})`:"var(--fg)");b.innerHTML=(c?"<i></i>":"")+l;
    b.onclick=()=>{mat=k;cours="";build(true)};el.appendChild(b)})}
function coursOpts(){const s=document.getElementById("cours");const ds=[...new Set(all.filter(x=>!mat||x.m===mat).map(x=>x.c))].sort();
  s.innerHTML=`<option value="">Tous les cours</option>`+ds.map(d=>`<option value="${d}">Cours du ${fmt(d)}</option>`).join("");s.value=cours}
function pool(){return all.filter(x=>(!mat||x.m===mat)&&(!cours||x.c===cours))}
function build(keepOrder){chips();coursOpts();
  deck=pool().filter(x=>!document.getElementById("onlyKo").checked||st[x.id]!=="ok");
  if(!keepOrder)deck.sort(()=>Math.random()-.5);i=0;flipped=false;render()}
function progress(){const p=pool();const k=p.filter(x=>st[x.id]==="ok").length,r=p.filter(x=>st[x.id]==="ko").length;
  document.getElementById("bk").style.width=(p.length?k/p.length*100:0)+"%";document.getElementById("br").style.width=(p.length?r/p.length*100:0)+"%";
  document.getElementById("ptxt").textContent=`${k} sues · ${r} à revoir · ${p.length-k-r} jamais vues · ${p.length} cartes`}
function render(){progress();const stage=document.getElementById("stage");
  if(!deck.length||i>=deck.length){stage.innerHTML=`<div class="done"><h2>${deck.length?"Paquet terminé":"Aucune carte ici"}</h2><p class="hint">${deck.length?"Recommencez, ou cochez « Seulement les cartes à revoir ».":"Toutes les cartes de cette sélection sont sues."}</p><button class="btn" type="button" id="again">Recommencer</button></div>`;
    document.getElementById("again").onclick=()=>build(false);return}
  const x=deck[i],[nom,c]=MATIERES[x.m];
  const tag=st[x.id]==="ok"?"Sue":st[x.id]==="ko"?"À revoir":"Nouvelle";
  stage.innerHTML=`<div class="card${flipped?" flip":""}" id="card" tabindex="0" role="button" aria-label="Retourner la carte" style="--c:var(${c})">
    <div class="face front"><div class="meta"><b>${nom}</b><span>Cours du ${fmt(x.c)} · ${tag}</span></div><div class="q"></div><div class="hint">Carte ${i+1} / ${deck.length} · cliquez pour voir la réponse</div></div>
    <div class="face back"><div class="meta"><b>${nom}</b><span>Réponse</span></div><div class="a"></div><div class="hint"></div></div></div>
    <div class="answer" style="margin-top:12px"><button class="ko" type="button" id="bko">À revoir</button><button class="okb" type="button" id="bok">Je sais</button></div>`;
  stage.querySelector(".q").textContent=x.q;stage.querySelector(".a").textContent=x.a;stage.querySelector(".back .hint").textContent=x.q;
  const card=document.getElementById("card");card.onclick=flip;
  document.getElementById("bko").onclick=()=>mark("ko");document.getElementById("bok").onclick=()=>mark("ok")}
function flip(){flipped=!flipped;document.getElementById("card")?.classList.toggle("flip",flipped)}
function mark(v){const x=deck[i];if(!x)return;st[x.id]=v;save();i++;flipped=false;render()}
document.getElementById("cours").onchange=e=>{cours=e.target.value;build(false)};
document.getElementById("onlyKo").onchange=()=>build(false);
document.getElementById("shuffle").onclick=()=>build(false);
document.getElementById("reset").onclick=()=>{pool().forEach(x=>delete st[x.id]);save();build(false)};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  if(e.key===" "){e.preventDefault();flip()}else if(e.key==="1")mark("ko");else if(e.key==="2")mark("ok");
  else if(e.key==="ArrowRight"&&i<deck.length){i++;flipped=false;render()}else if(e.key==="ArrowLeft"&&i>0){i--;flipped=false;render()}});
build(false);
</script>
</body></html>
