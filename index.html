<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Classeur de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar with sections; views swapped by hash — home (hero + 4 colour tiles + recent), subjects grid, subject page with tabs, all mind maps, flashcard decks, exam calendar */
:root{
  --bg:#f3f4f0; --paper:#fdfdfb; --fg:#1b2420; --muted:#5f6b66; --line:#dde2dc; --accent:#1f4d3f;
  --t1:#1f6b55; --t2:#3d55a6; --t3:#c2571f; --t4:#8a3f86;
  --m1:#0f6b5c; --m2:#3c5aa8; --m3:#8a3f86; --m4:#b4531f; --m5:#8a6d12; --m6:#b0303f; --m7:#4f6b12; --m8:#2f6f8f; --m9:#7a4b2a;
  --s1:#0f6b5c; --s2:#3c5aa8; --s3:#8a3f86; --s4:#b4531f; --s5:#8a6d12; --s6:#b0303f; --s7:#4f6b12; --s8:#2f6f8f; --s9:#7a4b2a;
  --up:#16794a; --down:#c2362b;
  --on:#ffffff;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --paper:#18201d; --fg:#e3ebe7; --muted:#97a39e; --line:#2b3531; --accent:#8fd3b8;
  --t1:#2f8f73; --t2:#5571c4; --t3:#d4692f; --t4:#a656a1;
  --m1:#4cc3ad; --m2:#8aa6f2; --m3:#d38bd0; --m4:#f08a52; --m5:#d9b54a; --m6:#f07a87; --m7:#b5cf5e; --m8:#6fc0e0; --m9:#d9a07a;
  --up:#5fd39a; --down:#ff8577; --on:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --paper:#18201d; --fg:#e3ebe7; --muted:#97a39e; --line:#2b3531; --accent:#8fd3b8;
  --t1:#2f8f73; --t2:#5571c4; --t3:#d4692f; --t4:#a656a1;
  --m1:#4cc3ad; --m2:#8aa6f2; --m3:#d38bd0; --m4:#f08a52; --m5:#d9b54a; --m6:#f07a87; --m7:#b5cf5e; --m8:#6fc0e0; --m9:#d9a07a;
  --up:#5fd39a; --down:#ff8577; --on:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px clamp(16px,4vw,40px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:18px;background:none;border:0;cursor:pointer;padding:0}
.brand i{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand i b{width:7px;height:7px;border-radius:2px}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{background:none;border:0;padding:7px 11px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.nav button:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.nav button[aria-current="page"]{color:var(--fg);background:color-mix(in srgb,var(--fg) 9%,transparent)}
@media (max-width:720px){.nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav button{white-space:nowrap}.brand{flex:1}.search{width:150px}}
.search{width:min(260px,100%);font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--fg)}

.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:28px 64px}
.view{display:grid;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{margin:0;color:var(--muted);max-width:60ch}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sect-h h2{font-weight:600;font-size:22px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px}

/* home hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-l{display:grid;gap:10px;align-content:center}
.hero-l h1{font-weight:800;font-size:clamp(36px,6vw,58px);line-height:.98}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.next{border-radius:18px;padding:20px 22px;color:var(--on);background:var(--cs,var(--c));display:grid;gap:4px;align-content:space-between;min-height:170px;position:relative;overflow:hidden;cursor:pointer;border:0;text-align:left}
.next::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:color-mix(in srgb,var(--on) 12%,transparent)}
.next .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:600}
.next .n{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.next .n small{font-size:20px;font-weight:600;margin-left:6px}
.next .w{font-weight:600;font-size:16px;position:relative;z-index:1}
.next .s{opacity:.9;font-size:13.5px;position:relative;z-index:1}

/* big tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.tiles{grid-template-columns:1fr}}
.tile{border:0;border-radius:18px;padding:18px;min-height:168px;display:grid;align-content:space-between;gap:16px;text-align:left;cursor:pointer;color:var(--on);background:var(--cs,var(--c));position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:0 10px 24px -12px color-mix(in srgb,var(--c) 80%,transparent)}
@media (prefers-reduced-motion:no-preference){.tile:hover{transform:translateY(-3px)}}
.tile svg{width:34px;height:34px}
.tile .tn{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.tile .td{font-size:13px;opacity:.9}
.tile .tc{position:absolute;right:16px;top:12px;font-family:var(--display);font-weight:800;font-size:44px;opacity:.28;font-variant-numeric:tabular-nums}

/* subject tiles */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mtile{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:0;overflow:hidden;cursor:pointer;text-align:left;display:grid;grid-template-rows:auto 1fr;transition:border-color .15s,transform .18s}
.mtile:hover{border-color:var(--c)}
@media (prefers-reduced-motion:no-preference){.mtile:hover{transform:translateY(-3px)}}
.mtile .band{background:var(--cs,var(--c));color:var(--on);padding:14px 16px;display:flex;align-items:center;gap:12px;min-height:74px}
.mono{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:color-mix(in srgb,var(--on) 20%,transparent);flex:none}
.mtile .band h3{font-weight:600;font-size:17px;line-height:1.15}
.mtile .body{padding:12px 16px 14px;display:grid;gap:8px;align-content:start}
.prof{font-size:13px;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.cnt{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,var(--paper));color:var(--c)}
.cnt.zero{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:500}
.exline{font-size:12.5px;color:var(--fg);font-weight:600}
.exline span{color:var(--muted);font-weight:500}

/* subject page */
.crumb{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.mhead{border-radius:20px;padding:22px 24px;background:var(--cs,var(--c));color:var(--on);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
@media (max-width:640px){.mhead{grid-template-columns:auto 1fr}.mhead .exchip{grid-column:1/-1}}
.mhead .mono{width:56px;height:56px;font-size:22px;border-radius:16px}
.mhead h1{font-weight:800;font-size:clamp(24px,4vw,36px);line-height:1.05}
.mhead p{margin:4px 0 0;opacity:.9;font-size:14px}
.exchip{background:color-mix(in srgb,var(--on) 18%,transparent);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.3}
.exchip b{font-family:var(--display);font-size:20px;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab span{font-size:12px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--c)}
.tab[aria-selected="true"] span{background:var(--cs,var(--c));color:var(--on)}

/* item cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{position:relative;display:grid;gap:8px;align-content:start;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-2px)}}
.card a.open{color:inherit;text-decoration:none}
.card a.open::after{content:"";position:absolute;inset:0;border-radius:12px}
.card a.open:focus-visible{outline:none}
.card:has(a.open:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.card .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.mname{font-size:12px;color:var(--muted)}
.new{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--cs,var(--c));color:var(--on)}
.card h3{font-weight:600;font-size:17px;line-height:1.2}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.card p.when{font-size:12.5px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.acts{display:flex;justify-content:flex-end}
.pbtn{position:relative;z-index:1;font-size:12.5px;font-weight:500;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.pbtn:hover{color:var(--fg);border-color:var(--fg)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);margin:0}
.group{display:grid;gap:10px}
.group h3{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.group h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* exams */
.ex-list{display:grid;gap:10px}
.ex{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;width:100%}
.ex:hover{border-color:var(--c)}
.ex .d{border-radius:12px;background:var(--cs,var(--c));color:var(--on);text-align:center;padding:8px 0;font-family:var(--display);line-height:1}
.ex .d b{display:block;font-size:26px;font-weight:800}
.ex .d span{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.ex .t{font-weight:600;font-size:16px}
.ex .s{font-size:13px;color:var(--muted)}
.ex .cd{font-family:var(--display);font-weight:700;font-size:15px;color:var(--c);text-align:right;white-space:nowrap}
.ex.past{opacity:.5}
@media (max-width:520px){.ex{grid-template-columns:60px 1fr}.ex .cd{grid-column:2;text-align:left}}

/* flashcard decks */
.deck{border:0;border-radius:16px;padding:16px;min-height:130px;color:var(--on);background:var(--cs,var(--c));display:grid;align-content:space-between;gap:10px;text-align:left;cursor:pointer;text-decoration:none;position:relative;overflow:hidden}
.deck::before,.deck::after{content:"";position:absolute;right:14px;top:14px;width:46px;height:60px;border-radius:7px;border:2px solid color-mix(in srgb,var(--on) 45%,transparent)}
.deck::after{right:22px;top:20px;transform:rotate(-8deg)}
.deck b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.deck span{font-weight:600;font-size:15px;max-width:75%}
.deck:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* market + news */
.mkt{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.mkt{grid-template-columns:1fr}}
.mkt[hidden]{display:none}
.news,.quotes{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.news{border-top:5px solid var(--t2)}
.quotes{border-top:5px solid var(--t1)}
.news h3{font-weight:700;font-size:21px;line-height:1.2}
.news p{margin:0}
.news .why{background:color-mix(in srgb,var(--t2) 9%,var(--paper));border-radius:12px;padding:10px 12px;font-size:14px}
.news a,.quotes a{color:var(--accent);font-weight:600}
.news ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:14px}
.qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.qh h3{font-weight:700;font-size:19px}
.qh span{font-size:12.5px;color:var(--muted)}
.qg{display:grid;gap:2px}
.qg h4{margin:6px 0 2px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qr{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.qr:last-child{border-bottom:0}
.qr b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.pill{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;min-width:66px;text-align:center}
.pill.up{color:var(--up);background:color-mix(in srgb,var(--up) 13%,var(--paper))}
.pill.down{color:var(--down);background:color-mix(in srgb,var(--down) 13%,var(--paper))}
.pill.flat{color:var(--muted);background:color-mix(in srgb,var(--fg) 6%,var(--paper))}
.qnote{font-size:12px;color:var(--muted);margin:0}

/* owner space */
.admin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.admin{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font-weight:600;font-size:20px}
.panel h3{font-weight:600;font-size:15px;margin-top:4px}
.fld{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{font:inherit;font-size:14.5px;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.fld textarea{resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.small{padding:4px 10px;font-size:12.5px;font-weight:500}
.btn:disabled{opacity:.55;cursor:default}
.msg{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.savebar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--t3) 14%,var(--paper));border:1px solid color-mix(in srgb,var(--t3) 40%,var(--line))}
.answer{font-size:15px;line-height:1.6;border-left:3px solid var(--t2);padding-left:12px;min-height:1em}
.answer:empty{display:none}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.note-prev{border:1px dashed var(--line);border-radius:14px;padding:16px;display:grid;gap:8px}
.note-prev .badge{color:var(--c)}
.note{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px);max-width:72ch;display:grid;gap:10px;line-height:1.6}
.note-prev .note{border:0;padding:0;background:none}
.note h2{font-family:var(--display);font-weight:600;font-size:22px;margin-top:10px;padding-top:10px;border-top:3px solid var(--c,var(--accent))}
.note h3{font-family:var(--display);font-weight:600;font-size:17px;color:var(--c,var(--accent))}
.note p,.note ul,.note ol,.note blockquote{margin:0}
.note ul,.note ol{padding-left:1.2em;display:grid;gap:4px}
.note table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.note th,.note td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.note th{background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--paper))}
.note blockquote{border-left:3px solid var(--c,var(--accent));padding:6px 12px;background:color-mix(in srgb,var(--c,var(--accent)) 7%,var(--paper));border-radius:0 8px 8px 0}

footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;z-index:20}
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" type="button" data-go="accueil" aria-label="Accueil du Classeur"><i id="brandDots"></i>Classeur</button>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-go="accueil">Accueil</button>
      <button type="button" data-go="matieres">Matières</button>
      <button type="button" data-go="cartes">Cartes mentales</button>
      <button type="button" data-go="flashcards">Flashcards</button>
      <button type="button" data-go="examens">Examens</button>
      <button type="button" data-go="admin" id="navAdmin" hidden>Mon espace</button>
    </nav>
    <input id="q" class="search" type="search" placeholder="Rechercher…" aria-label="Rechercher une fiche ou une notion">
  </div>
</header>

<main class="wrap" id="app"></main>

<script>

/* ---------- printable download (downloads capability) ---------- */
let downloads=null;
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("downloads").then(d=>{downloads=d;if(d)route()}).catch(()=>{});

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
async function printable(f){
  const res=await fetch(f.href.split("#")[0]);let html=await res.text();
  html=html.replace(/<style>\.cl-back[\s\S]*?<\/nav>/,"");
  const isMap=f.type==="Carte mentale";
  const head=`<script>document.documentElement.setAttribute("data-theme","light");${isMap?"window.PRINT_ALL=true;":""}<\/script><style>@page{margin:12mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}nav.toc,.tools{display:none!important}@media print{.shell,.wrap{display:block!important}a{color:inherit}}</style>`;
  const tail=isMap?"":`<script>addEventListener("load",()=>{document.querySelectorAll("details").forEach(d=>d.open=true);setTimeout(()=>print(),1500)})<\/script>`;
  return html.replace(/<head[^>]*>/i,m=>m+head).replace(/<\/body>/i,tail+"</body>");
}
async function doPrint(f,btn){
  if(!downloads)return;btn.disabled=true;
  try{await downloads.save({filename:f.href.split("#")[0].replace(".html","-imprimable.html"),data:await printable(f)});toast("Fichier enregistré : ouvrez-le, l'impression se lance toute seule.")}
  catch(e){if(e&&e.code==="declined"){}else if(e&&e.code==="rate_limited")toast("Une fenêtre d'enregistrement est déjà ouverte.");else toast("Le téléchargement n'est pas disponible ici.")}
  finally{btn.disabled=false}
}


/* ---------- daily market + news (marche.json, refreshed by a scheduled task) ---------- */
let MARKET=null;
fetch("marche.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{MARKET=d;const b=document.getElementById("marketBox");if(b)fillMarket(b)}).catch(()=>{});
function fillMarket(box){
  const d=MARKET;if(!d||!d.groupes)return;
  const pct=v=>{const n=Number(v);const cls=n>0.004?"up":n<-0.004?"down":"flat";return `<span class="pill ${cls}">${n>0?"+":n<0?"−":""}${Math.abs(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})} %</span>`};
  const maj=d.maj?new Date(d.maj):null;
  const majTxt=maj?maj.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+" à "+maj.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";
  const a=d.actu||{};
  box.innerHTML=`
    <article class="news">
      <div class="eyebrow">L'actu du jour${a.date?" · "+fmt(a.date):""}</div>
      <h3>${esc(a.titre||"")}</h3>
      <p>${esc(a.resume||"")}</p>
      ${a.cours?`<p class="why">${esc(a.cours)}</p>`:""}
      ${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Lire l'article${a.source?" ("+esc(a.source)+")":""} →</a>`:""}
      ${(d.titres||[]).length?`<div class="eyebrow" style="margin-top:6px">À suivre aussi</div><ul>${d.titres.map(t=>`<li><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.t)}</a></li>`).join("")}</ul>`:""}
    </article>
    <section class="quotes" aria-label="Les marchés">
      <div class="qh"><h3>Les marchés</h3><span>${esc(d.seance||"")}</span></div>
      ${d.groupes.map(g=>`<div class="qg"><h4>${esc(g.titre)}</h4>${g.lignes.map(l=>`<div class="qr"><span>${esc(l.nom)}</span><b>${esc(l.valeur)}</b>${pct(l.var)}</div>`).join("")}</div>`).join("")}
      <p class="qnote">Mis à jour ${esc(majTxt)}${d.source?` · Source : <a href="${esc(d.source.url)}" target="_blank" rel="noopener">${esc(d.source.nom)}</a>`:""}. Cours de clôture, pas du temps réel.</p>
    </section>`;
  box.hidden=false;
}

/* ================= Mon espace (owner only) ================= */
let USER=null, SAMPLE=null, ART=null, IS_OWNER=false;
const PENDING={changed:false};
const COLORS=["--m1","--m2","--m3","--m4","--m5","--m6","--m7","--m8","--m9"];
const ALLOWED=new Set(["H2","H3","H4","P","UL","OL","LI","STRONG","EM","B","I","TABLE","THEAD","TBODY","TR","TH","TD","BLOCKQUOTE","CODE","BR","HR","DIV","SPAN","SUB","SUP"]);
function sanitize(html){
  const doc=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html");
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===1){ if(!ALLOWED.has(c.tagName)){ if(["SCRIPT","STYLE","IFRAME","OBJECT"].includes(c.tagName)){c.remove();return} const frag=document.createDocumentFragment();while(c.firstChild)frag.appendChild(c.firstChild);c.replaceWith(frag);walk(n);return}
      [...c.attributes].forEach(a=>c.removeAttribute(a.name)); walk(c);}
    else if(c.nodeType!==3)c.remove();});};
  const root=doc.body.firstChild;walk(root);return root.innerHTML;
}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x"}
function mdLite(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>")}

const onAdmin=()=>((location.hash||"").slice(1)||current)==="admin";
async function initOwner(){
  if(!(window.claude&&typeof window.claude.use==="function"))return;

  window.claude.use("sample").then(s=>{SAMPLE=s;if(onAdmin())route()}).catch(()=>{});
  window.claude.use("artifact").then(a=>{ART=a;if(onAdmin())route()}).catch(()=>{});
  if(onAdmin())route();
}

/* ---- save: rewrite the data block of index.html and publish it ---- */
async function saveSite(btn,msg){
  if(!ART){msg.textContent="L'enregistrement n'est pas disponible dans cette vue.";return}
  btn.disabled=true;msg.textContent="Enregistrement…";
  try{
    const src=await (await fetch("index.html",{cache:"no-store"})).text();
    const json=JSON.stringify({matieres:MATIERES,fiches:FICHES,exams:EXAMS,notes:NOTES}).replace(/</g,"\\u003c");
    const BEG="/*DATA-"+"BEGIN*/",END="/*DATA-"+"END*/";const a=src.indexOf(BEG),b=src.indexOf(END);
    if(a<0||b<0||!/^<!doctype html>/i.test(src.trim()))throw {code:"bad_source"};
    const html=src.slice(0,a+BEG.length)+json+src.slice(b);
    try{sessionStorage.setItem("classeur-go","admin")}catch(e){}
    await ART.publish(html);
    msg.textContent="Enregistré. La page se recharge.";
  }catch(e){
    const c=e&&e.code;
    msg.textContent= c==="conflict"?"Une version plus récente vient d'être publiée : la page se recharge, refaites la modification.":
      c==="not_writer"||c==="not_granted"?"Cette vue est en lecture seule : vous ne pouvez pas enregistrer ici.":
      c==="rate_limited"?"Trop d'enregistrements d'affilée : attendez un peu.":
      c==="bad_source"?"Impossible de relire la page pour l'enregistrer.":"L'enregistrement a échoué. Réessayez dans un instant.";
    btn.disabled=false;
  }
}

/* ---- PDF reading (pdf.js loaded on demand from cdnjs) ---- */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfReady=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
function loadPdfJs(){
  if(!pdfReady)pdfReady=loadScript(PDFJS+"pdf.min.js").then(()=>loadScript(PDFJS+"pdf.worker.min.js")).then(()=>{const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";return L}).catch(e=>{pdfReady=null;throw e});
  return pdfReady;
}
function itemsToText(items){let out="";for(const it of items){out+=it.str;out+=it.hasEOL?"\n":" "}return out.replace(/[ \t]+\n/g,"\n").replace(/ {2,}/g," ")}
async function readPdf(file,onStep){
  const L=await loadPdfJs();
  const doc=await L.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
  let text="";
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);text+=`\n\n[Page ${i}]\n`+itemsToText((await pg.getTextContent()).items);onStep&&onStep(i,doc.numPages)}
  return {doc,text:text.trim(),pages:doc.numPages,chars:text.replace(/\[Page \d+\]|\s/g,"").length};
}
async function pdfPagesAsImages(doc,max){
  const out=[];
  for(let i=1;i<=Math.min(doc.numPages,max);i++){
    const pg=await doc.getPage(i);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2,1400/vp0.width)});
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.82)));
  }
  return out;
}
/* Reads a PDF picked in `input`, writes status into `msg`; resolves {text, images} */
async function pdfFromInput(input,msg){
  const f=input.files&&input.files[0];if(!f)return null;
  if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){msg.textContent="Choisissez un fichier PDF.";return null}
  msg.textContent="Lecture du PDF…";
  try{
    const r=await readPdf(f,(i,n)=>{msg.textContent=`Lecture du PDF… page ${i} / ${n}`});
    if(r.chars>=300){msg.textContent=`PDF lu : ${r.pages} pages, ${r.text.length.toLocaleString("fr-FR")} caractères.`;return {text:r.text,images:[],name:f.name}}
    const lim=SAMPLE&&SAMPLE.limits?await SAMPLE.limits().catch(()=>null):null;
    if(!lim||!lim.images){msg.textContent="Ce PDF est scanné (pas de texte lisible) et Claude ne peut pas lire d'images ici. Collez le texte à la main.";return null}
    const max=Math.min(lim.images.maxCount,20);msg.textContent="PDF scanné : conversion des pages en images…";
    const imgs=await pdfPagesAsImages(r.doc,max);
    msg.textContent=`PDF scanné : Claude lira ${imgs.length} page${imgs.length>1?"s":""} en image${r.pages>max?` (sur ${r.pages}, limite atteinte)`:""}.`;
    return {text:"",images:imgs,name:f.name};
  }catch(e){msg.textContent="Impossible de lire ce PDF (protégé ou endommagé ?). Collez le texte à la main.";return null}
}

  if(!n||!f){v.innerHTML=`<p class="empty">Cette fiche n'existe plus.</p>`;return}
  const m=mat(f.m);paint(v,m.c);
  const back=document.createElement("button");back.className="link";back.type="button";back.textContent="← "+m.nom;back.onclick=()=>go("m-"+m.id+"_fiches");
  const crumb=document.createElement("div");crumb.className="crumb";crumb.appendChild(back);v.appendChild(crumb);
  const h=document.createElement("section");h.className="mhead";
  h.innerHTML=`<span class="mono">${SHORT[m.id]||esc(m.nom[0])}</span><div><h1></h1><p>${coursLabel(f)}</p></div>`;h.querySelector("h1").textContent=f.titre;v.appendChild(h);
  const art=document.createElement("article");art.className="note";art.innerHTML=sanitize(n.html);v.appendChild(art);
}

/* ---------- routing ---------- */
let current="accueil";
function go(r){current=r;document.getElementById("q").value="";try{if(location.hash.slice(1)!==r)history.pushState(null,"","#"+r)}catch(e){}route();window.scrollTo({top:0})}
function route(){
  const q=document.getElementById("q").value.trim();
  let r=q?"recherche":((location.hash||"").slice(1)||current);
  const navKey=r.startsWith("m-")||r.startsWith("fiche-")?"matieres":r;
  document.querySelectorAll(".nav button").forEach(b=>{if(b.dataset.go===navKey)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(q)return vSearch(q);
  if(r==="admin")return vAdmin();
  if(r.startsWith("fiche-"))return vNote(r.slice(6));
  if(r.startsWith("m-")){const [id,tab]=r.slice(2).split("_");if(MATIERES.some(m=>m.id===id))return vMatiere(id,tab)}
  ({matieres:vMatieres,cartes:vCartes,flashcards:vFlash,examens:vExamens}[r]||vHome)();
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
window.addEventListener("hashchange",()=>{current=(location.hash||"").slice(1)||"accueil";route()});
window.addEventListener("popstate",()=>{current=(location.hash||"").slice(1)||"accueil";route()});
let st;document.getElementById("q").addEventListener("input",()=>{clearTimeout(st);st=setTimeout(route,120)});
try{const g=sessionStorage.getItem("classeur-go");if(g){sessionStorage.removeItem("classeur-go");current=g;history.replaceState(null,"","#"+g)}}catch(e){}
route();
initOwner();
</script>
</body></html>
